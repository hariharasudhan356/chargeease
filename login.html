<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login • ChargeEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center">
  <div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md">
    <h1 class="text-4xl font-bold text-center mb-8">Welcome Back</h1>
    
    <div class="space-y-6">
      <input id="email" type="email" placeholder="Email" value="demo@chargeease.in" class="w-full bg-zinc-800 p-4 rounded-2xl"/>
      <input id="password" type="password" placeholder="Password" value="1234" class="w-full bg-zinc-800 p-4 rounded-2xl"/>
      
      <div class="flex gap-4">
        <button onclick="login('user')" class="flex-1 bg-emerald-500 text-black font-bold py-4 rounded-2xl">User Login</button>
        <button onclick="login('admin')" class="flex-1 border border-emerald-500 font-bold py-4 rounded-2xl">Admin Login</button>
      </div>
    </div>
  </div>

  <script>
    function login(role) {
      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('role', role);
      localStorage.setItem('userEmail', document.getElementById('email').value);
      window.location.href = role === 'user' ? 'user.html' : 'admin.html';
    }
  </script>
</body>
</html>
