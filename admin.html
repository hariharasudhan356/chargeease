<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin • ChargeEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
  <nav class="fixed top-0 w-full bg-zinc-900 z-50 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between">
      <div class="flex items-center gap-3"><span class="text-3xl">⚡</span><h1 class="text-3xl font-bold">ChargeEase Admin</h1></div>
      <button onclick="logout()" class="text-red-400">Logout</button>
    </div>
  </nav>

  <div class="pt-24 max-w-7xl mx-auto px-6 py-10">
    <h2 class="text-5xl font-bold mb-10">Station Overview • Coimbatore</h2>
    <div class="bg-zinc-900 rounded-3xl p-8">
      <table class="w-full">
        <thead><tr class="border-b border-zinc-700"><th class="py-4 text-left">Station</th><th>Today's Bookings</th><th>Revenue</th><th>Occupancy</th></tr></thead>
        <tbody id="admin-table"></tbody>
      </table>
    </div>
  </div>

  <script>
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    
    window.onload = () => {
      if (localStorage.getItem('role') !== 'admin') window.location.href = 'login.html';
      
      document.getElementById('admin-table').innerHTML = `
        <tr class="border-b border-zinc-700"><td class="py-6">VEEV Brookfields</td><td>18</td><td>₹4,500</td><td class="text-emerald-400">92%</td></tr>
        <tr class="border-b border-zinc-700"><td class="py-6">Tata Power Race Course</td><td>14</td><td>₹3,250</td><td class="text-emerald-400">85%</td></tr>
        <tr><td class="py-6">Zeon Avinashi Rd</td><td>22</td><td>₹5,500</td><td class="text-emerald-400">95%</td></tr>
      `;
    };
  </script>
</body>
</html>
