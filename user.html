<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChargeEase • User Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>#map{height:520px;}</style>
</head>
<body class="bg-zinc-950 text-white">
  <nav class="fixed top-0 w-full bg-zinc-900 z-50 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between">
      <div class="flex items-center gap-3"><span class="text-3xl">⚡</span><h1 class="text-3xl font-bold">ChargeEase</h1></div>
      <div class="flex items-center gap-6">
        <span id="user-email" class="text-emerald-400"></span>
        <button onclick="logout()" class="text-red-400">Logout</button>
      </div>
    </div>
  </nav>

  <div class="pt-24 max-w-7xl mx-auto px-6 py-10">
    <h2 class="text-5xl font-bold mb-10">Live Chargers in Coimbatore</h2>
    
    <div class="grid md:grid-cols-2 gap-10">
      <!-- Map -->
      <div id="map" class="rounded-3xl overflow-hidden border border-zinc-700"></div>
      
      <!-- Stations List -->
      <div id="stations-list" class="space-y-4"></div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div id="booking-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[10000]">
    <div class="bg-zinc-900 rounded-3xl p-8 max-w-lg w-full">
      <h3 class="text-3xl font-bold mb-6">Book at <span id="modal-station-name"></span></h3>
      <input id="booking-time" type="datetime-local" class="w-full bg-zinc-800 p-4 rounded-2xl mb-6"/>
      <button onclick="proceedToPayment()" class="w-full bg-emerald-500 text-black font-bold py-5 rounded-2xl">Continue to Payment ₹25</button>
    </div>
  </div>

  <!-- Payment Modal -->
  <div id="payment-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[10000]">
    <div class="bg-zinc-900 rounded-3xl p-10 max-w-md w-full text-center">
      <h3 class="text-3xl font-bold mb-6">Secure Payment</h3>
      <p class="text-2xl mb-8">₹25 • Booking Fee</p>
      <button onclick="completeBooking()" class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold text-xl w-full py-6 rounded-3xl">Pay Now with UPI / Card</button>
    </div>
  </div>

  <!-- Receipt + QR Modal -->
  <div id="receipt-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[10000]">
    <div class="bg-zinc-900 rounded-3xl p-10 max-w-md w-full text-center">
      <h3 class="text-3xl font-bold text-emerald-400 mb-6">Booking Confirmed!</h3>
      <div id="qr-container" class="mx-auto mb-6"></div>
      <div id="receipt-details" class="text-left bg-zinc-800 p-6 rounded-2xl mb-8"></div>
      <button onclick="closeReceipt()" class="bg-emerald-500 text-black font-bold py-4 px-12 rounded-2xl">Done</button>
    </div>
  </div>

  <script>
    // Real Coimbatore stations (Feb 2026)
    const stations = [
      {id:1, name:"VEEV Brookfields Mall", addr:"Dr Krishnasamy Mudaliyar Rd", lat:11.0125, lng:76.9678, avail:3, total:6, type:"DC Fast"},
      {id:2, name:"Tata Power Vivanta Race Course", addr:"105 Race Course Rd", lat:11.0183, lng:76.9558, avail:5, total:8, type:"DC Fast"},
      {id:3, name:"ChargeZone Puliakulam", addr:"Avinashi Rd, Puliakulam", lat:11.0123, lng:76.9845, avail:2, total:5, type:"DC + AC"},
      {id:4, name:"Zeon Avinashi Road", addr:"Avinashi Road", lat:11.0321, lng:76.9789, avail:4, total:7, type:"DC Fast"},
      {id:5, name:"Ather Grid Gandhipuram", addr:"Gandhipuram", lat:11.0089, lng:76.9623, avail:1, total:4, type:"AC Level 2"},
      {id:6, name:"Tata Power Peelamedu", addr:"Peelamedu", lat:11.0256, lng:77.0023, avail:6, total:10, type:"DC Fast"},
      {id:7, name:"OnePlug Singanallur", addr:"Trichy Main Road", lat:11.0005, lng:76.9902, avail:0, total:3, type:"30kW"},
      {id:8, name:"Fun Republic Mall", addr:"Peelamedu", lat:11.0250, lng:77.0000, avail:3, total:6, type:"DC Fast"}
    ];

    let currentBooking = null;
    let map;

    function renderStations() {
      document.getElementById('stations-list').innerHTML = stations.map(s => `
        <div onclick="bookStation(${s.id})" class="bg-zinc-800 hover:bg-zinc-700 p-6 rounded-3xl cursor-pointer flex justify-between">
          <div>
            <h4 class="font-bold">${s.name}</h4>
            <p class="text-sm text-zinc-400">${s.addr} • ${s.type}</p>
          </div>
          <div class="text-right">
            <span class="text-4xl font-bold ${s.avail>0?'text-emerald-400':'text-red-400'}">${s.avail}</span>
            <span class="block text-xs">/ ${s.total}</span>
          </div>
        </div>
      `).join('');
    }

    function initMap() {
      map = L.map('map').setView([11.0168, 76.9558], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      
      stations.forEach(s => {
        L.marker([s.lat, s.lng]).addTo(map)
          .bindPopup(`<b>${s.name}</b><br>${s.avail}/${s.total} free`);
      });
    }

    function bookStation(id) {
      currentBooking = stations.find(s => s.id === id);
      document.getElementById('modal-station-name').textContent = currentBooking.name;
      document.getElementById('booking-modal').classList.remove('hidden');
    }

    function proceedToPayment() {
      document.getElementById('booking-modal').classList.add('hidden');
      document.getElementById('payment-modal').classList.remove('hidden');
    }

    function completeBooking() {
      document.getElementById('payment-modal').classList.add('hidden');
      
      const time = document.getElementById('booking-time').value || "2026-02-15 10:30";
      currentBooking.bookingTime = time;
      currentBooking.bookingId = "CE" + Date.now().toString().slice(-6);
      
      confetti({particleCount:150});
      
      // Show receipt + QR
      showReceipt();
    }

    function showReceipt() {
      const container = document.getElementById('qr-container');
      container.innerHTML = '<div id="qrcode" class="mx-auto"></div>';
      new QRCode("qrcode", {
        text: JSON.stringify(currentBooking),
        width: 220,
        height: 220
      });

      document.getElementById('receipt-details').innerHTML = `
        <p><strong>Booking ID:</strong> ${currentBooking.bookingId}</p>
        <p><strong>Station:</strong> ${currentBooking.name}</p>
        <p><strong>Time:</strong> ${currentBooking.bookingTime}</p>
        <p><strong>Amount Paid:</strong> ₹25</p>
        <p class="text-emerald-400 mt-4">✅ Show this QR at the station to start charging</p>
      `;
      
      document.getElementById('receipt-modal').classList.remove('hidden');
    }

    function closeReceipt() {
      document.getElementById('receipt-modal').classList.add('hidden');
      alert("Your booking is confirmed! Check My Bookings in the app.");
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    // Init
    window.onload = () => {
      if (!localStorage.getItem('loggedIn')) {
        window.location.href = 'login.html';
      }
      document.getElementById('user-email').textContent = localStorage.getItem('userEmail') || 'demo@chargeease.in';
      renderStations();
      initMap();
    };
  </script>
</body>
</html>
